body {

background-color: #f5ebe0; color: #1b263b;

.slide { display: none;
min-height: calc(100vh - 70px); width: 100%;
animation: fadeIn 0.35s ease-out forwards;
}
.slide.active { display: flex; }
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

Chef Logo */ .chef-float {
animation: floatChef 3.2s ease-in-out infinite alternate; }

0% { transform: translateY(0px); }
100% { transform: translateY(-12px); }
}

.pan-sizzle {
animation: panSizzleAnim 1.6s ease-in-out infinite alternate;
transform-origin: 150px 140px;
}
@keyframes panSizzleAnim {
0% { transform: rotate(-1deg) translateY(0px); }
50% { transform: rotate(1deg) translateY(-2px); }
100% { transform: rotate(-0.5deg) translateY(1px); }
}
.steak-sizzle {
animation: steakAnim 0.8s infinite ease-in-out alternate; }
@keyframes steakAnim {
0% { transform: scale(0.97); }
100% { transform: scale(1.03); }
}
.steam-rise {
animation: steamAnim 2.2s ease-out infinite; opacity: 0; }
.steam-delay-1 { animation-delay: 0.7s; }
.steam-delay-2 { animation-delay: 1.4s; }
@keyframes steamAnim {
0% { transform: translateY(0) scaleX(1); opacity: 
0.85; }
50% { transform: translateY(-25px) scaleX(1.3); opacity: 0.4; }
100% { transform: translateY(-50px) scaleX(1.6); opacity: 0; } }
.blue-flame {
animation: flameFlicker 0.4s ease-in-out infinite alternate; }
@keyframes flameFlicker {
0% { transform: scaleY(0.9); opacity: 0.85; }
100% { transform: scaleY(1.15); opacity: 1; }
}
.scrollbar-thin::-webkit-scrollbar { height: 6px;
}
.scrollbar-thin::-webkit-scrollbar-track {
background: #e3d5ca;
border-radius: 10px;
}
.scrollbar-thin::-webkit-scrollbar-thumb {
background: #6b1d28;
border-radius: 10px;
